info:
  name: Post a category
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/geostreams/api/data/categories/"
  body:
    type: json
    data: |-
      {
          "name": "Phosphorus",
          "detail_type": "time"
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{api_key}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
