info:
  name: Get datapoints by parameter binned yearly
  type: http
  seq: 15

http:
  method: GET
  url: "{{base_url}}/data/cache/year/?sensor_id=5678&shortened=true"
  params:
    - name: sensor_id
      value: "5678"
      type: query
    - name: shortened
      value: "true"
      type: query
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
