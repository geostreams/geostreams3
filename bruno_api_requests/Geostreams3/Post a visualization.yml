info:
  name: Post a visualization
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/data/visualizations/"
  body:
    type: json
    data: |-
      {
        "name": "scatter",
        "title": "Scatter Plot"
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{api_key}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
