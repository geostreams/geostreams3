info:
  name: Post a sensor
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/geostreams/api/data/sensors/"
  body:
    type: json
    data: |-
      {
        "name": "Reinhart",
        "created": "2023-07-24T17:14:47.783Z",
        "geoType":"Feature",
        "geometry": {
                  "type": "Point",
                  "coordinates": [
                      -88.290075,
                      40.0062722,
                      0.0
                  ]
              },
        "parameters": [
          "nitrogen",
          "phosphorus"
        ],
        "properties": {}
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{api_key}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
