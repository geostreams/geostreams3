info:
  name: Post a parameter
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/data/parameters/?username=mohanar2@illinois.edu"
  params:
    - name: username
      value: mohanar2@illinois.edu
      type: query
  body:
    type: json
    data: |-
      {
      "name": "air_pressure",
      "title": "Air Pressure",
      "unit": "Pa",
      "category": "Flux Tower",
      "visualization": "line"
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{api_key}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
