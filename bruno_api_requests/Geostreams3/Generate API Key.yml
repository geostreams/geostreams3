info:
  name: Generate API Key
  type: http
  seq: 29

http:
  method: POST
  url: "{{base_url}}/geostreams/api/auth/generate-api-key/"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const response = res.getBody();
        bru.setGlobalEnvVar("api_key", response["key"]);
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.key
        method: jsonq
      variable:
        name: api_key
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
