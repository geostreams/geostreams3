info:
  name: Get datapoints by parameter binned daily
  type: http
  seq: 14

http:
  method: GET
  url: "{{base_url}}/geostreams/api/data/cache/day/?sensor_id=3"
  params:
    - name: sensor_id
      value: "3"
      type: query
    - name: parameter
      value: sif
      type: query
      disabled: true
    - name: parameter
      value: co2_flux
      type: query
      disabled: true
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
