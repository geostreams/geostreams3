info:
  name: Get all sensors
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/geostreams/api/data/sensors/?type=geojson"
  params:
    - name: type
      value: geojson
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
