<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        {% if message %}
            <p style="color: red">{{ message }}</p>
        {% endif %}
        <button type="submit">Login</button>
    </form>
</body>
</html>
