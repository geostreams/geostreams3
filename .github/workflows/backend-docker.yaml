name: Backend Docker Build

on:
    workflow_dispatch:
    workflow_run:
      workflows: ["Geostreams3 Tests"]
      types:
        - completed
      branches:
        - main
    push:
      branches:
        - main
      tags:
        - v*
      paths:
        - 'backend/**'

env:
  PLATFORM: linux/amd64,linux/arm64
  REGISTRY: "hub.ncsa.illinois.edu"

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if triggered manually, by a tag push, or if the test workflow succeeded
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/geostreams3/backend

      - name: Print metadata
        run: |
          echo "REGISTRY: ${{ env.REGISTRY }}"
          echo "PLATFORM: ${{ env.PLATFORM }}"
          echo "IMAGE: ${{ env.REGISTRY }}/geostreams3/backend"
          echo "TAGS: ${{ steps.meta.outputs.tags }}"
          echo "LABELS: ${{ steps.meta.outputs.labels }}"

      - name: Login to the NCSA HUB registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NCSA_HUB_USERNAME }}
          password: ${{ secrets.NCSA_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: ${{ env.PLATFORM }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend/
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
