name: Geostreams3 Tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/sensordata/**'
      - 'backend/authentication/**'
      - 'backend/geostreams3/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg14-latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ${{ secrets.TIMESCALEDB_PASSWORD }}
        ports:
          - 5433:5432

    env:
      DJANGO_SETTINGS_MODULE: geostreams3.settings


    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install postgresql-client and GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          sudo apt-get install gdal-bin libgdal-dev


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create env file
        run: |
          touch .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.TIMESCALEDB_PASSWORD }}" >> .env
          echo "POSTGRES_DB=postgres" >> .env
          echo "POSTGRES_HOST=localhost" >> .env
          echo "POSTGRES_PORT=5433" >> .env
          echo "SECRET_KEY=test" >> .env
          echo "KEYCLOAK_SERVER_URL=http://dummy-keycloak" >> .env
          echo "KEYCLOAK_REALM=dummy-realm" >> .env
          echo "KEYCLOAK_CLIENT_ID=dummy-client-id" >> .env
          echo "KEYCLOAK_CLIENT_SECRET=dummy-client-secret" >> .env

      - name: Run Database Migrations
        run: |
          cd backend
          python manage.py migrate

      - name: Run Tests
        run: |
          cd backend
          python manage.py test
