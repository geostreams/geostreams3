version: "3.3"

services:
  postgres:
    image: mdillon/postgis:9.5
    networks:
      - smartfarm_geostreams
    ports:
      - 5432:5432
    volumes:
      - smartfarm_postgres:/var/lib/postgresql/data
    restart: unless-stopped

networks:
    smartfarm_geostreams:

volumes:
  smartfarm_postgres:
