services:

  # postgresql + postgis + timescale database
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    platform: linux/amd64 #for platform error on Apple M1 chips
    networks:
      - geostreams
    # Remove this port mapping in production
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=geostreams
    volumes:
      - timescaledb:/home/postgres/pgdata/data
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    networks:
      - geostreams
    command:
      - start-dev
      - --import-realm
      - --http-relative-path=/geostreams/keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL_HOST=kc_postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KEYCLOAK_HOSTNAME=localhost
    volumes:
      - ./keycloak/geostreams-realm.json:/opt/keycloak/data/import/realm.json:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${SITE_URL}`) && PathPrefix(`/geostreams/keycloak`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak.priority=10"
      # Uncomment this for production
      # - "traefik.http.routers.keycloak.entrypoints=websecure"
      # - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
    depends_on:
      - kc_postgres

  kc_postgres:
    image: postgres
    platform: linux/amd64 #for platform error on Apple M1 chips
    networks:
      - geostreams
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    restart: unless-stopped
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
    labels:
      - "traefik.enable=false"

  # The containers we create for the backend and frontend
  backend:
    build:
      context: ./backend
    container_name: geostreams-backend
    env_file:
      #      TODO: Fix the env configuration
      - ./backend/.env
    depends_on:
      - timescaledb
      - keycloak
    networks:
      - geostreams
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/geostreams/api`)"
      - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/geostreams/api"
      - "traefik.http.routers.backend.middlewares=strip-api-prefix@docker"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.priority=5"
      # Uncomment this for production
      # - "traefik.http.routers.backend.entrypoints=websecure"
      # - "traefik.http.routers.backend.tls.certresolver=letsencrypt"

  frontend:
    build:
      context: ./frontend
    container_name: geostreams-frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`${SITE_URL}`) && PathPrefix(`/geostreams`)"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"
        - "traefik.http.routers.frontend.priority=1"
        - "traefik.http.routers.frontend.entrypoints=web"
        # Uncomment this for production
        # - "traefik.http.routers.frontend.entrypoints=websecure"
        # - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
    restart: unless-stopped
    networks:
      - geostreams

  traefik:
    image: traefik:v2.5
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --providers.docker
      - --entryPoints.web.address=:80
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      - "8081:8080"
    networks:
      - geostreams
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock

  # Production traefik
    # traefik:
      # image: traefik:v3.2
      # restart: unless-stopped
      # command:
      #     - '--log.level=${LOG_LEVEL:-INFO}'
      #     - '--entrypoints.web.address=:80'
      #     - '--entrypoints.websecure.address=:443'
      #     - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
      #     - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
      #     - '--providers.docker=true'
      #     - '--providers.docker.exposedByDefault=false'
      #     - '--api=true'
      #     - '--api.dashboard=true'
      #     - '--certificatesresolvers.letsencrypt.acme.email=${EMAIL}'
      #     - '--certificatesresolvers.letsencrypt.acme.storage=/acme.json'
      #     - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      #     - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
      #     # Optional: Use staging server during testing
      #     # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      # ports:
      #     # The HTTP port
      #     - '80:80'
      #     - '443:443'
      # networks:
      #     - geostreams
      # volumes:
      #     # So that Traefik can listen to the Docker events
      #     - /var/run/docker.sock:/var/run/docker.sock
