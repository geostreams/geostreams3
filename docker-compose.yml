version: "3.3"

services:

  # postgresql + postgis + timescale database
  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: timescaledb
    networks:
    - geostreams
    ports:
    - '5432:5432'
    environment:
    - POSTGRES_PASSWORD=geostreams
    volumes:
    - postgres:/var/lib/postgresql/data
    restart: unless-stopped


networks:
  geostreams:

volumes:
  postgres:


