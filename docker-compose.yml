version: "3.3"

services:

  # postgresql + postgis + timescale database
  postgres:
    image: timescale/timescaledb-ha:pg14-latest
    networks:
    - geostreams
    ports:
    - 5433:5432
    environment:
    - POSTGRES_PASSWORD=geostreams
    volumes:
    - postgres:/home/postgres/pgdata/data
    restart: unless-stopped


networks:
  geostreams:

volumes:
  postgres:
