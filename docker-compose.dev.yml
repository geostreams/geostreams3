# TODO: Change the names
services:

  # postgresql + postgis + timescale database
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    platform: linux/amd64 #for platform error on Apple M1 chips
    networks:
    - geostreams
    ports:
    - 5433:5432
    environment:
    - POSTGRES_PASSWORD=geostreams
    volumes:
    - timescaledb:/home/postgres/pgdata/data
    restart: unless-stopped

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    networks:
    - geostreams
    command:
      - start-dev
      - --import-realm
      - --http-relative-path=/geostreams/keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=kc_postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
    volumes:
      - ./keycloak/geostreams-realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./keycloak/themes/geostreams:/opt/keycloak/themes/geostreams:ro
    depends_on:
        - kc_postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/geostreams/keycloak`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak.priority=10"
      - "traefik.http.routers.keycloak.entrypoints=web"

  kc_postgres:
    image: postgres:17-alpine
    platform: linux/amd64 #for platform error on Apple M1 chips
    networks:
    - geostreams
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    volumes:
    - keycloak_postgres:/var/lib/postgresql/data

  traefik:
    image: traefik:v2.5
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --providers.docker
      - --entryPoints.web.address=:80
    ports:
      - "80:80"
      - "8081:8080"
    networks:
      - geostreams
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock


networks:
  geostreams:

volumes:
  timescaledb:
  keycloak_postgres:
