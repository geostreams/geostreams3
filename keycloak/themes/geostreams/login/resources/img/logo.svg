<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <!-- Outer circle -->
  <circle cx="28" cy="28" r="24" stroke="#ffffff" stroke-width="2.5" fill="rgba(255,255,255,0.12)"/>
  <!-- G: open arc from top-right, around left, to bottom-right -->
  <path d="M33 19a10 10 0 1 0 0 18h0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- G horizontal bar: from center to the arc end -->
  <line x1="27" y1="28" x2="33" y2="28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- G vertical stem: short downstroke from bar to close the opening -->
  <line x1="33" y1="28" x2="33" y2="37" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Superscript 3 -->
  <text x="37" y="22" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
</svg>
